name: foltio

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: foltio
      POSTGRES_USER: foltio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foltio-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foltio -d foltio"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-foltio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-foltio-local-storage}
      MINIO_API_CORS_ALLOW_ORIGIN: ${FOLTIO_ORIGIN:-http://localhost:3000}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

  storage-init:
    build:
      context: .
      target: api
    depends_on:
      - minio
    environment:
      STUDIO_S3_ENDPOINT: http://minio:9000
      STUDIO_S3_PUBLIC_ENDPOINT: ${FOLTIO_STORAGE_ORIGIN:-http://localhost:9000}
      STUDIO_S3_REGION: us-east-1
      STUDIO_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-foltio}
      STUDIO_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-foltio-local-storage}
      STUDIO_S3_BUCKET: foltio-media
      STUDIO_S3_FORCE_PATH_STYLE: "1"
    command: ["node", "scripts/init-storage.mjs"]
    restart: "no"

  migrate:
    build:
      context: .
      target: api
    environment:
      STUDIO_DATABASE_URL: postgresql://foltio:${POSTGRES_PASSWORD:-foltio-local}@postgres:5432/foltio
    command: ["node", "scripts/migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      FOLTIO_LOCAL_MODE: "1"
      STUDIO_HOST: 0.0.0.0
      STUDIO_PORT: 8810
      STUDIO_PUBLIC_ORIGIN: ${FOLTIO_ORIGIN:-http://localhost:3000}
      STUDIO_DATABASE_URL: postgresql://foltio:${POSTGRES_PASSWORD:-foltio-local}@postgres:5432/foltio
      STUDIO_S3_ENDPOINT: http://minio:9000
      STUDIO_S3_PUBLIC_ENDPOINT: ${FOLTIO_STORAGE_ORIGIN:-http://localhost:9000}
      STUDIO_S3_REGION: us-east-1
      STUDIO_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-foltio}
      STUDIO_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-foltio-local-storage}
      STUDIO_S3_BUCKET: foltio-media
      STUDIO_S3_FORCE_PATH_STYLE: "1"
      STUDIO_WORKER: ${STUDIO_WORKER:-1}
      FAL_KEY: ${FAL_KEY:-}
    volumes:
      - work-data:/tmp/studio-work
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8810/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  work-data:
